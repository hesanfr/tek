<style>
    .banner {
        width: 100%;
        overflow: hidden;
    }

    .banner img {
        width: 100%;
        height: 450px;
        object-fit: cover;
        display: block;
    }

    /* مانیتورهای خیلی بزرگ */
    @media (min-width: 1600px) {
        .banner img {
            height: 600px;
        }
    }

    /* مانیتورهای بزرگ */
    @media (min-width: 1200px) and (max-width: 1599px) {
        .banner img {
            height: 500px;
        }
    }

    /* لپ تاپ */
    @media (min-width: 992px) and (max-width: 1199px) {
        .banner img {
            height: 420px;
        }
    }

    /* تبلت افقی و عمودی */
    @media (min-width: 769px) and (max-width: 991px) {
        .banner img {
            height: 350px;
        }
    }

    /* موبایل بزرگ */
    @media (min-width: 481px) and (max-width: 768px) {
        .banner img {
            height: 280px;
        }
    }

    /* موبایل کوچک */
    @media (max-width: 480px) {
        .banner img {
            height: 200px;
        }
    }
</style>
